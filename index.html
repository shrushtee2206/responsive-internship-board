<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Responsive internship board for students to search and filter internship opportunities."
    >

    <title>Internship Board | EdVyro Task 2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <p class="eyebrow">STUDENT OPPORTUNITIES</p>
            <h1>Responsive Internship Board</h1>
            <p class="subtitle">
                Find internships by role, domain, and work mode.
            </p>
        </div>
    </header>


    <main class="container">

        <!-- Search and filters -->
        <section class="filters-section" aria-labelledby="filter-heading">

            <h2 id="filter-heading">Find an Internship</h2>

            <div class="filters">

                <div class="form-group">
                    <label for="searchInput">Search internships</label>

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search by title or skill..."
                        autocomplete="off"
                    >
                </div>


                <div class="form-group">
                    <label for="domainFilter">Filter by domain</label>

                    <select id="domainFilter">
                        <option value="all">All domains</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="modeFilter">Filter by work mode</label>

                    <select id="modeFilter">
                        <option value="all">All modes</option>
                        <option value="Remote">Remote</option>
                        <option value="Hybrid">Hybrid</option>
                        <option value="On-site">On-site</option>
                    </select>
                </div>

            </div>

        </section>


        <!-- Status messages -->
        <section
            id="statusArea"
            class="status-area"
            aria-live="polite"
            aria-atomic="true"
        >
            <p id="statusMessage">Loading internships...</p>

            <button
                id="retryButton"
                class="retry-button hidden"
                type="button"
            >
                Try Again
            </button>
        </section>


        <!-- Internship listings -->
        <section aria-labelledby="internship-heading">

            <div class="results-header">
                <h2 id="internship-heading">Available Internships</h2>

                <p id="resultCount">0 internships</p>
            </div>

            <div
                id="internshipList"
                class="internship-grid"
                aria-live="polite"
            >
            </div>

        </section>

    </main>


    <!-- Details modal -->
    <dialog id="detailsDialog" class="dialog">

        <div class="dialog-content">

            <button
                id="closeDialog"
                class="close-button"
                type="button"
                aria-label="Close internship details"
            >
                ×
            </button>

            <div id="dialogContent"></div>

        </div>

    </dialog>


    <!-- Application modal -->
    <dialog id="applicationDialog" class="dialog">

        <div class="dialog-content">

            <button
                id="closeApplicationDialog"
                class="close-button"
                type="button"
                aria-label="Close application form"
            >
                ×
            </button>

            <h2>Apply for Internship</h2>

            <p id="applicationRole"></p>

            <form id="applicationForm">

                <div class="form-group">
                    <label for="applicantName">Full Name</label>

                    <input
                        type="text"
                        id="applicantName"
                        name="applicantName"
                        required
                        autocomplete="name"
                    >
                </div>


                <div class="form-group">
                    <label for="applicantEmail">Email Address</label>

                    <input
                        type="email"
                        id="applicantEmail"
                        name="applicantEmail"
                        required
                        autocomplete="email"
                    >
                </div>


                <div class="form-group">
                    <label for="applicantMessage">
                        Why are you interested?
                    </label>

                    <textarea
                        id="applicantMessage"
                        name="applicantMessage"
                        rows="4"
                        required
                    ></textarea>
                </div>


                <button
                    class="primary-button"
                    type="submit"
                >
                    Submit Application
                </button>

            </form>

            <p
                id="applicationMessage"
                class="application-message"
                aria-live="polite"
            ></p>

        </div>

    </dialog>


    <footer class="site-footer">
        <p>
            Responsive Internship Board · EdVyro Full Stack Development Task 2
        </p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
